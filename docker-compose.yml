# FraudOps local stack. Zero cloud cost: everything runs in Docker.
#
#   make up        -> core profile (postgres, minio, mlflow, api)
#   make up-full   -> full profile (adds airflow; Kafka arrives with the
#                     streaming phase and also belongs to `full`)
#
# Services tagged [core, full] so that `--profile full` includes the base.

name: fraudops

x-app-env: &app-env
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_S3_ENDPOINT_URL: http://minio:9000
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-fraudops}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-fraudops-local}
  FRAUDOPS_MODEL_NAME: fraudops-lightgbm
  FRAUDOPS_ADMIN_TOKEN: ${FRAUDOPS_ADMIN_TOKEN:-change-me-local-dev-token}

services:
  postgres:
    image: postgres:16-alpine
    profiles: [core, full]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraudops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraudops-local}
      POSTGRES_DB: ${POSTGRES_DB:-fraudops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fraudops} -d ${POSTGRES_DB:-fraudops}"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    # object store for MLflow artifacts (S3-compatible API);
    # images live on quay.io since Docker Hub retirement
    image: quay.io/minio/minio:latest
    profiles: [core, full]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fraudops}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fraudops-local}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    # one-shot: create the mlflow artifacts bucket
    image: quay.io/minio/mc:latest
    profiles: [core, full]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-fraudops} ${MINIO_ROOT_PASSWORD:-fraudops-local} &&
      mc mb --ignore-existing local/mlflow"

  mlflow:
    build: ./infra/docker/mlflow
    profiles: [core, full]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-fraudops}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-fraudops-local}
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER:-fraudops}:${POSTGRES_PASSWORD:-fraudops-local}@postgres:5432/mlflow
      --artifacts-destination s3://mlflow
      --default-artifact-root s3://mlflow
      --allowed-hosts "*"
    # ^ local dev only: clients reach the server as both `mlflow` (docker
    #   network) and `localhost` (browser); host validation is a production
    #   hardening feature we disable in this zero-cost local stack
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    profiles: [core, full]
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-fraudops}:${POSTGRES_PASSWORD:-fraudops-local}@postgres:5432/${POSTGRES_DB:-fraudops}
    ports:
      - "${API_PORT:-8000}:8000"

  bootstrap:
    # one-shot training job: trains on the mounted dataset and registers a
    # model. Lives in its own `tools` profile so `up` never auto-starts it;
    # the Makefile runs it via `docker compose --profile tools run --rm
    # bootstrap <action>`
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    profiles: [tools]
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      <<: *app-env
    volumes:
      - ./data:/data:ro
      - ./configs:/app/configs:ro
      - ./reports:/app/reports
    entrypoint: ["python", "-m", "fraudops.registry.bootstrap"]

  airflow:
    build:
      context: .
      dockerfile: infra/docker/airflow/Dockerfile
    profiles: [full]
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      <<: *app-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-fraudops}:${POSTGRES_PASSWORD:-fraudops-local}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__FERNET_KEY: ""
      FRAUDOPS_DATA_DIR: /data/raw
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./data:/data:ro
      - ./configs:/opt/airflow/configs:ro
      - ./scripts:/opt/airflow/scripts:ro
      - ./reports:/opt/airflow/reports
      - airflow-logs:/opt/airflow/logs
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    # single-container local deployment: API server + scheduler + dag processor
    command: standalone

  kafka:
    # single-broker KRaft (no zookeeper); internal listener for the stack,
    # external for host-side tools
    image: apache/kafka:3.9.0
    profiles: [full]
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  scorer:
    # streaming consumer: kafka -> champion model -> predictions (+ features)
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    profiles: [full]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      <<: *app-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATABASE_URL: postgresql://${POSTGRES_USER:-fraudops}:${POSTGRES_PASSWORD:-fraudops-local}@postgres:5432/${POSTGRES_DB:-fraudops}
    command: ["python", "-m", "fraudops.streaming.consumer"]

  label-release:
    # moves labels into visibility once the simulated clock passes their
    # availability time (default 7 simulated days after the transaction)
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    profiles: [full]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-fraudops}:${POSTGRES_PASSWORD:-fraudops-local}@postgres:5432/${POSTGRES_DB:-fraudops}
    command: ["python", "-m", "fraudops.streaming.labels"]

  monitor:
    # drift reference from the training split + rolling PSI/KS/performance
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    profiles: [full, monitoring]
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-fraudops}:${POSTGRES_PASSWORD:-fraudops-local}@postgres:5432/${POSTGRES_DB:-fraudops}
      FRAUDOPS_DATA_DIR: /data/raw
    volumes:
      - ./data:/data:ro
      - ./configs:/app/configs:ro
      - ./reports:/app/reports
    ports:
      - "${MONITOR_METRICS_PORT:-9101}:9101"
    command: ["python", "-m", "fraudops.monitoring.monitor"]

  replay:
    # one-shot producer; `make replay` runs it against the live stack
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    profiles: [tools]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      <<: *app-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATABASE_URL: postgresql://${POSTGRES_USER:-fraudops}:${POSTGRES_PASSWORD:-fraudops-local}@postgres:5432/${POSTGRES_DB:-fraudops}
    volumes:
      - ./data:/data:ro
      - ./configs:/app/configs:ro
    entrypoint: ["python", "-m", "fraudops.streaming.replay"]

  prometheus:
    image: prom/prometheus:v3.7.1
    profiles: [full, monitoring]
    volumes:
      - ./dashboards/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [full, monitoring]
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./dashboards/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./dashboards/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

volumes:
  pgdata:
  minio-data:
  airflow-logs:
