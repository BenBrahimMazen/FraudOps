[project]
name = "fraudops"
version = "0.1.0"
description = "Real-time fraud detection with a closed-loop MLOps pipeline (portfolio project)"
authors = [{ name = "Mazen Ben Brahim" }]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # floors are honest minimums, not resolved versions: the uv.lock pins the
    # exact versions used by the application and tests, while the Airflow
    # image installs this package under Airflow's own constraints (older
    # fastapi/pandas/boto3 pins).
    "boto3>=1.28",
    "confluent-kafka>=2.0",
    "evidently>=0.4",
    "fastapi>=0.110",
    "joblib>=1.3",
    "lightgbm>=4.1",
    "matplotlib>=3.8",
    "mlflow>=2.14",
    "numpy>=1.26",
    "pandas>=2.0",
    "prometheus-client>=0.19",
    "psycopg[binary]>=3.1",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "scipy>=1.10",
    "shap>=0.44",
    "uvicorn[standard]>=0.28",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "locust>=2.46.6",
    "mypy>=2.3.1",
    "nbformat>=5.11.1",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudops"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import order
    "UP",  # pyupgrade (keep code modern for py311)
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
# Practical scope: the package only. Tests exercise the real contract
# through pytest; dynamically built Pydantic models are typed as Any on
# purpose (schemas.py explains why).
files = ["src/fraudops"]
python_version = "3.11"
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true

